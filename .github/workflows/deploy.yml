name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ── 1. Lint & validate ──────────────────────────────────────────────────
  lint:
    name: Lint & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JSON files
        run: |
          echo "Checking vercel.json..."
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('✓ vercel.json valid');"

      - name: Lint API files (Node syntax check)
        run: |
          node --check api/explain.js  && echo "✓ api/explain.js"
          node --check api/sports.js   && echo "✓ api/sports.js"

      - name: Validate HTML structure
        run: |
          grep -c "<!DOCTYPE html>" index.html && echo "✓ index.html has DOCTYPE"
          grep -c "/api/explain"    index.html && echo "✓ index.html calls /api/explain"
          grep -c "/api/sports"     index.html && echo "✓ index.html calls /api/sports"

      - name: Run integration test
        run: |
          npm test
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-flash-lite-latest"

  # ── 2. Security scan ────────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for hardcoded API keys..."
          # Fail if any real key patterns appear in committed files
          if grep -rE "(AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9]{40,})" --include="*.js" --include="*.html" --include="*.json" .; then
            echo "ERROR: Possible hardcoded secret found!" && exit 1
          fi
          echo "✓ No hardcoded secrets detected"

      - name: Check env var usage pattern
        run: |
          grep "process.env.GEMINI_API_KEY"  api/explain.js && echo "✓ GEMINI_API_KEY via env"
          grep "process.env.SERPAPI_KEY"     api/sports.js  && echo "✓ SERPAPI_KEY via env"

  # ── 3. Preview deploy (PRs) ─────────────────────────────────────────────
  deploy-preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    needs: [lint, security]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel Token
        id: check-token
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "ℹ️ VERCEL_TOKEN not provided. Skipping preview deployment via CLI."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.check-token.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        if: steps.check-token.outputs.has_token == 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        if: steps.check-token.outputs.has_token == 'true'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        if: steps.check-token.outputs.has_token == 'true'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to preview
        if: steps.check-token.outputs.has_token == 'true'
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$URL" >> $GITHUB_OUTPUT
          echo "✓ Preview deployed: $URL"

  # ── 4. Production deploy (main branch) ──────────────────────────────────
  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: [lint, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel Token
        id: check-token
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "ℹ️ VERCEL_TOKEN is not configured in GitHub Secrets."
            echo "ℹ️ Note: Vercel's native GitHub App deploys automatically on every push!"
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.check-token.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        if: steps.check-token.outputs.has_token == 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        if: steps.check-token.outputs.has_token == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        if: steps.check-token.outputs.has_token == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        if: steps.check-token.outputs.has_token == 'true'
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "production_url=$URL" >> $GITHUB_OUTPUT
          echo "✓ Production deployed: $URL"

      - name: Smoke test – index.html loads
        if: steps.check-token.outputs.has_token == 'true'
        run: |
          URL="${{ steps.deploy.outputs.production_url }}"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          [ "$HTTP" = "200" ] && echo "✓ index.html returns 200" || (echo "✗ Got $HTTP" && exit 1)
